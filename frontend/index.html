<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/kle-tech-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>KLE Tech Placement Portal</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#191d25" />
    <meta name="description" content="KLE Technological University placement management portal for students, recruiters, and placement staff." />
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KLE Placements" />
    <link rel="apple-touch-icon" href="/icons/kle-tech-logo.png" />

    <!-- Microsoft PWA -->
    <meta name="msapplication-TileColor" content="#191d25" />
    <meta name="msapplication-TileImage" content="/icons/kle-tech-logo.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module">
      if ('serviceWorker' in navigator) {
        // A localhost development server must never be controlled by an old
        // precached build; it can serve stale, incompatible React bundles.
        if (import.meta.env.DEV) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            registrations.forEach((registration) => registration.unregister());
          });
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((reg) => console.log('SW registered:', reg.scope))
              .catch((err) => console.log('SW registration failed:', err));
          });
        }
      }
    </script>
  </body>
</html>
